<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLDAC STUDIO | Connecting...</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #e0e0e0;
            --accent-color: #ff3e00;
        }

        body, html {
            margin: 0;
            padding: 0;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100%;
            touch-action: none; /* Critical for mobile flicking */
        }

        /* Ambient Textures & CRT Effects */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.12;
            pointer-events: none;
            z-index: 50;
        }

        .crt-flicker {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 51;
        }

        /* THE BEAUTIFUL LOGO LAYER */
        .brand-bg-logo {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            max-width: 900px;
            opacity: 0.08; /* Default subtle state */
            z-index: 10;
            transition: all 0.3s ease-in-out;
        }

            /* The "Population" pulse triggered by the flip */
            .brand-bg-logo.active {
                opacity: 0.35;
                filter: drop-shadow(0 0 15px rgba(224, 224, 224, 0.5));
                transform: translate(-50%, -50%) scale(1.02);
            }

            .brand-bg-logo svg {
                width: 100%;
                height: auto;
                fill: var(--text-color);
                shape-rendering: geometricPrecision;
            }

        /* UI LAYER */
        .container {
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            height: 100vh;
            position: relative;
            z-index: 100;
            pointer-events: none;
        }

        .brand-header {
            font-weight: bold;
            font-size: clamp(1.4rem, 4vw, 2.2rem);
            letter-spacing: 6px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--text-color);
            display: inline-block;
            margin-bottom: 20px;
            pointer-events: auto;
        }

        #status-log {
            font-size: 0.9rem;
            line-height: 1.8;
            color: #888;
            max-width: 550px;
            pointer-events: auto;
        }

        /* THE 5x5 ART CARD INTERACTION */
        #gram-wrapper {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            perspective: 1000px;
            z-index: 200;
        }

        #art-card {
            width: 80px;
            height: 80px;
            background: #ffffff;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            cursor: grab;
            border-radius: 1px;
            transform-style: preserve-3d;
            pointer-events: auto;
        }

        .card-label {
            font-size: 9px;
            text-align: center;
            font-family: sans-serif;
            font-weight: 900;
            letter-spacing: 1px;
            line-height: 1.2;
        }

        .location-tag {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 0.7rem;
            color: var(--accent-color);
            z-index: 300;
            letter-spacing: 2px;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 12px;
            background: var(--text-color);
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% {
                opacity: 0;
            }

            50% {
                opacity: 1;
            }
        }
    </style>
</head>

    <div class="container">
        <div class="brand-header">SOLDAC STUDIO</div>
        <div id="status-log">
            <div id="init-msg">> ...</div>
            <div id="log-content"></div>
            <span class="cursor"></span>
        </div>
    </div>

    <div id="gram-wrapper">
        <div id="art-card">
            <div class="card-label">A GRAM<br>OF ART</div>
        </div>
    </div>

    <div class="location-tag">EXTREME NORTH / 69.2° N</div>

    <script>
        const card = document.getElementById('art-card');
        const wrapper = document.getElementById('gram-wrapper');
        const bgTarget = document.getElementById('bg-target');
        const logContent = document.getElementById('log-content');
        const initMsg = document.getElementById('init-msg');
        const lang = navigator.language || navigator.userLanguage;

        // PHYSICS STATE
        let startY = 0;
        let isFlipping = false;
        const frags = ["Traditional", "Contemporary", "Arctic", "Archive", "69.2° N", "A Gram", "Soldac"];

        // 1. INPUT HANDLERS (MOBILE + DESKTOP)
        const startAction = (e) => {
            if (isFlipping) return;
            startY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            card.style.cursor = 'grabbing';
        };

        const endAction = (e) => {
            if (isFlipping) return;
            const endY = e.type.includes('touch') ? e.changedTouches[0].clientY : e.clientY;
            // Detect flick up
            if (startY - endY > 40) performFlip();
            card.style.cursor = 'grab';
        };

        // 2. THE FLIP SEQUENCE
        function performFlip() {
            isFlipping = true;

            // Generate data fragment for the log
            const f = frags[Math.floor(Math.random() * frags.length)];
            addLog(`> [${f.toUpperCase()}] DETECTED...`);

            // Flip Animation
            card.style.transition = "transform 0.7s cubic-bezier(0.23, 1, 0.32, 1)";
            card.style.transform = "translateY(-300px) rotateX(720deg) scale(1.4)";

            // Populating Glow on the Beautiful Logo
            bgTarget.classList.add('active');

            setTimeout(() => {
                // Return to hand
                card.style.transition = "transform 0.4s ease-in";
                card.style.transform = "translateY(0) rotateX(0deg) scale(1)";

                // End pulse
                setTimeout(() => {
                    bgTarget.classList.remove('active');
                    isFlipping = false;
                }, 100);
            }, 700);
        }

        // 3. LOGGING SYSTEM
        function addLog(msg) {
            const div = document.createElement('div');
            div.innerHTML = msg;
            logContent.appendChild(div);
            // Keep logs clean
            if (logContent.childNodes.length > 8) logContent.removeChild(logContent.firstChild);
        }

        // 4. EVENT LISTENERS
        wrapper.addEventListener('mousedown', startAction);
        window.addEventListener('mouseup', endAction);
        wrapper.addEventListener('touchstart', startAction);
        window.addEventListener('touchend', endAction);

        // 5. TRANSLATIONS & BOOT SEQUENCE
        const translations = {
            en: { init: "INITIATING SYSTEM...", msgs: ["Waking up archive...", "Syncing traditional vs contemporary...", "Flick card to sync node."] },
            pt: { init: "INICIANDO SISTEMA...", msgs: ["A acordar arquivo...", "Sincronizando tradicional vs contemporâneo...", "Lance a carta para sincronizar."] },
            es: { init: "INICIANDO SISTEMA...", msgs: ["Despertando archivo...", "Sincronizando tradicional vs contemporáneo...", "Lanza la carta para sincronizar."] }
        };

        let selected = translations.en;
        if (lang.startsWith('pt')) selected = translations.pt;
        else if (lang.startsWith('es')) selected = translations.es;

        initMsg.innerHTML = `> ${selected.init}`;

        let msgIndex = 0;
        function bootMessages() {
            if (msgIndex < selected.msgs.length) {
                addLog(`> ${selected.msgs[msgIndex]}`);
                msgIndex++;
                setTimeout(bootMessages, 1800);
            }
        }
        bootMessages();

        // 6. SERVER STATUS (RENDER COLD START)
        function checkServer() {
            fetch('https://https://grams-backend-clean.onrender.com', { mode: 'no-cors' })
                .then(() => addLog("<span style='color:#00ff00'>> NODE ONLINE. SYSTEM READY.</span>"))
                .catch(() => setTimeout(checkServer, 5000));
        }
        setTimeout(checkServer, 3000);
    </script>
    <script>
(function () {
  const BACKEND = "https://grams-backend-clean.onrender.com";
  const url = new URL(location.href);
  const tag = url.searchParams.get("tag");

  if (!tag) {
    addLog("> ERROR: NFC TAG MISSING.");
    return;
  }

  const TARGET = `${BACKEND}/t/${encodeURIComponent(tag)}`;
  const HEALTH = `${BACKEND}/api/health?ts=${Date.now()}`;

  let attempts = 0;
  const MAX = 30; // ~30s

  function wake() {
    attempts++;
    addLog(`> WAKING NODE… (${attempts})`);

    fetch(HEALTH, { cache: "no-store" })
      .then(r => {
        if (r.ok) {
          addLog("<span style='color:#00ff00'>> NODE ONLINE. TRANSFERRING…</span>");
          setTimeout(() => {
            location.replace(TARGET);
          }, 700);
        } else {
          retry();
        }
      })
      .catch(retry);
  }

  function retry() {
    if (attempts >= MAX) {
      addLog("> TAKING LONGER THAN USUAL. TAP TO CONTINUE.");
      card.onclick = () => location.href = TARGET;
      return;
    }
    setTimeout(wake, 1000);
  }

  // Start after a short cinematic delay
  setTimeout(wake, 2500);
})();
</script>
